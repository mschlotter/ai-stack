services:
  crw:
    environment:
      - CRW_EXTRACTION__LLM__PROVIDER=${LLM_PROVIDER:-openai-compatible}
      - CRW_EXTRACTION__LLM__BASE_URL=${LLM_BASE_URL:-http://localhost:11435/v1}
      - CRW_EXTRACTION__LLM__MODEL=${LLM_MODEL:-unsloth/Qwen3.6-35B-A3B-GGUF:Q5_K_XL}
      - CRW_EXTRACTION__LLM__API_KEY=${LLM_API_KEY:-llama}
    networks:
      - default     # talks to sidecars (searxng, lightpanda, etc.)
      - ai-network  # talks to local LLM service

networks:
  default:
  ai-network:
    name: ai-network
    driver: bridge
    external: false
