services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    ipc: host
    ports:
      - "11436:8000"
    environment:
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_XET_HIGH_PERFORMANCE=1
      - HTTPX_TIMEOUT=30.0
    volumes:
      - /home/michael/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --host 0.0.0.0
      --port 8000
      --max-model-len 163840
      --max-num-seqs 8
      --quantization modelopt
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --enable-prefix-caching
      nvidia/Qwen3.6-35B-A3B-NVFP4
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    networks:
      - ai-network

networks:
  ai-network:
    name: ai-network
    driver: bridge